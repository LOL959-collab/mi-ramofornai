<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Amore 🌼</title>
<style>
  :root{
    --amarillo: #F3B806;
    --amarillo-suave: #FCE59A;
    --amarillo-profundo: #C98A02;
    --fondo: #FFF8E1;
    --fondo2: #FFEFC2;
    --tinta: #4A3705;
    --tinta-suave: #7A5C0B;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100%;
    background: radial-gradient(circle at 20% 10%, var(--fondo2), var(--fondo) 60%);
    font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
    color: var(--tinta);
    overflow-x:hidden;
    position:relative;
  }

  /* ---- pétalos cayendo ---- */
  .petalo{
    position:fixed;
    top:-10vh;
    pointer-events:none;
    z-index:1;
    opacity:0.85;
    animation: caer linear infinite;
  }
  @keyframes caer{
    0%{ transform: translateY(-10vh) translateX(0) rotate(0deg); }
    100%{ transform: translateY(110vh) translateX(var(--drift, 40px)) rotate(360deg); }
  }

  main{
    position:relative;
    z-index:2;
    max-width: 640px;
    margin: 0 auto;
    padding: 64px 28px 90px;
    text-align:center;
  }

  .fecha{
    letter-spacing: 0.04em;
    color: var(--tinta-suave);
    font-size: 0.95rem;
    margin-bottom: 6px;
  }

  .flor-hero{
    width: 130px;
    height: 130px;
    margin: 18px auto 10px;
    animation: mecer 4.5s ease-in-out infinite;
    transform-origin: bottom center;
  }
  @keyframes mecer{
    0%,100%{ transform: rotate(-4deg); }
    50%{ transform: rotate(4deg); }
  }

  h1{
    font-size: clamp(2rem, 7vw, 2.9rem);
    line-height: 1.15;
    margin: 8px 0 2px;
    font-weight: 500;
    color: var(--amarillo-profundo);
  }

  h2{
    font-family: 'Snell Roundhand', 'Brush Script MT', cursive;
    font-weight: 400;
    font-size: clamp(2.6rem, 10vw, 3.6rem);
    margin: 0 0 30px;
    color: var(--tinta);
  }

  .carta{
    background: rgba(255,255,255,0.55);
    border: 1px solid rgba(201,138,2,0.25);
    border-radius: 18px;
    padding: 38px 30px;
    margin: 0 auto 40px;
    backdrop-filter: blur(2px);
    box-shadow: 0 20px 60px -25px rgba(122,92,11,0.35);
  }

  .mensaje{
    font-size: clamp(1.15rem, 4vw, 1.4rem);
    line-height: 1.75;
    color: var(--tinta);
    margin: 0;
    text-align: left;
  }

  .mensaje .saludo{
    display:block;
    margin-bottom: 14px;
  }

  .firma{
    margin-top: 26px;
    font-family: 'Snell Roundhand', 'Brush Script MT', cursive;
    font-size: 1.8rem;
    color: var(--amarillo-profundo);
  }

  .distancia{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 14px;
    margin: 10px 0 6px;
    color: var(--tinta-suave);
    font-size: 0.95rem;
  }
  .linea{
    flex:1;
    max-width: 80px;
    height:1px;
    background: linear-gradient(90deg, transparent, var(--amarillo-profundo), transparent);
  }

  footer{
    text-align:center;
    padding: 20px;
    font-size: 0.8rem;
    color: var(--tinta-suave);
    opacity: 0.7;
    position: relative;
    z-index: 2;
  }

  @media (prefers-reduced-motion: reduce){
    .petalo{ animation: none; display:none; }
    .flor-hero{ animation: none; }
  }

  /* ---- botón sorpresa ---- */
  .btn-sorpresa{
    appearance:none;
    border:none;
    cursor:pointer;
    font-family: inherit;
    font-size: 1.05rem;
    letter-spacing: 0.01em;
    color:#fff;
    background: linear-gradient(135deg, var(--amarillo), var(--amarillo-profundo));
    padding: 16px 34px;
    border-radius: 999px;
    box-shadow: 0 16px 34px -14px rgba(153,108,3,0.65);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .btn-sorpresa:hover{ transform: translateY(-2px) scale(1.03); box-shadow: 0 20px 40px -14px rgba(153,108,3,0.75); }
  .btn-sorpresa:active{ transform: translateY(0) scale(0.97); }

  /* ---- overlay video ---- */
  .overlay{
    position:fixed;
    inset:0;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:center;
    background: rgba(28,20,2,0.82);
    opacity:0;
    visibility:hidden;
    transition: opacity 0.4s ease;
    padding: 24px;
  }
  .overlay.activo{ opacity:1; visibility:visible; }

  .video-marco{
    position:relative;
    width: min(92vw, 380px);
    border-radius: 22px;
    overflow:hidden;
    background:#000;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.7);
    transform: scale(0.7) rotate(-2deg);
    opacity:0;
    transition: transform 0.55s cubic-bezier(.2,.8,.25,1.2), opacity 0.45s ease;
  }
  .overlay.activo .video-marco{ transform: scale(1) rotate(0deg); opacity:1; }
  .overlay.cerrando .video-marco{ transform: scale(0.6) rotate(3deg); opacity:0; transition: transform 0.5s ease-in, opacity 0.4s ease-in; }

  .video-marco video{
    display:block;
    width:100%;
    max-height: 78vh;
    background:#000;
  }

  .cerrar-overlay{
    position:absolute;
    top:10px;
    right:10px;
    width:36px;
    height:36px;
    border-radius:50%;
    border:none;
    background: rgba(0,0,0,0.45);
    color:#fff;
    font-size:1.1rem;
    line-height:1;
    cursor:pointer;
    z-index:2;
  }

  /* ---- ramo 3D ---- */
  .seccion-ramo{
    position:relative;
    z-index:2;
    max-width: 640px;
    margin: 0 auto;
    padding: 10px 20px 70px;
    text-align:center;
    display:none;
    opacity:0;
    transform: translateY(24px);
    transition: opacity 0.7s ease, transform 0.7s ease;
  }
  .seccion-ramo.mostrar{ display:block; }
  .seccion-ramo.visible{ opacity:1; transform: translateY(0); }

  .ramo-titulo{
    font-family: 'Snell Roundhand', 'Brush Script MT', cursive;
    font-size: clamp(1.8rem, 6vw, 2.4rem);
    color: var(--amarillo-profundo);
    margin: 6px 0 4px;
  }
  .ramo-subtitulo{
    font-size: 0.9rem;
    color: var(--tinta-suave);
    margin: 0 0 18px;
  }

  #canvas-ramo{
    width:100%;
    height:540px;
    border-radius:22px;
    background:radial-gradient(circle at 50% 30%, #FFF4CE, #FFE6A0 75%);
    box-shadow:inset 0 0 0 1px rgba(201,138,2,0.2),0 20px 50px -25px rgba(122,92,11,0.4);
    touch-action:none;
    cursor:grab;
    display:block;
  }
  #canvas-ramo:active{cursor:grabbing;}
</style>

<style id="bouquet-upgrade">
/* Ramo mejorado: volumen, iluminación y flores más naturales sin tocar el resto de la página */
.bouquet, .ramo, #bouquet, #ramo, .bouquet-scene, .flower-bouquet {
  filter: drop-shadow(0 24px 28px rgba(0,0,0,.20));
  transform: translateY(-2px);
  transition: transform .5s ease, filter .5s ease;
}
.bouquet:hover, .ramo:hover, #bouquet:hover, #ramo:hover, .bouquet-scene:hover, .flower-bouquet:hover {
  transform: translateY(-5px) scale(1.015);
  filter: drop-shadow(0 30px 35px rgba(0,0,0,.25));
}
.bouquet img, .ramo img, #bouquet img, #ramo img {
  filter: saturate(1.08) contrast(1.03) brightness(1.03);
  border-radius: 12px;
}
.bouquet-upgrade-glow {
  position:absolute; inset:8% 15% 15%;
  background: radial-gradient(circle, rgba(255,226,74,.18), transparent 62%);
  filter: blur(18px); pointer-events:none; z-index:0;
}
</style>

</head>

<main>
  <p class="fecha">🌼 Día de las Flores Amarillas</p>

  <svg class="flor-hero" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <g transform="translate(60,60)">
      <ellipse rx="14" ry="30" fill="#F3B806" transform="rotate(0)"/>
      <ellipse rx="14" ry="30" fill="#F3B806" transform="rotate(45)"/>
      <ellipse rx="14" ry="30" fill="#F3B806" transform="rotate(90)"/>
      <ellipse rx="14" ry="30" fill="#F3B806" transform="rotate(135)"/>
      <ellipse rx="14" ry="30" fill="#FBCD3D" transform="rotate(22.5)"/>
      <ellipse rx="14" ry="30" fill="#FBCD3D" transform="rotate(67.5)"/>
      <ellipse rx="14" ry="30" fill="#FBCD3D" transform="rotate(112.5)"/>
      <ellipse rx="14" ry="30" fill="#FBCD3D" transform="rotate(157.5)"/>
      <circle r="14" fill="#C98A02"/>
    </g>
  </svg>

  
  <h2>Amore</h2>

  <div class="carta">
    <p class="mensaje">
      <span class="saludo">Hola mi amor,</span>
      te hice esto porque estamos lejos, algún día estaré junto a vos, te podré dar muchas floressss. Te amo muchote, hoy y siempre.
    </p>
    <p class="firma">Tuyo, siempre</p>
  </div>

  <div class="distancia">
    <span class="linea"></span>
    <span>Siempre pienso en vos</span>
    <span class="linea"></span>
  </div>

  <button class="btn-sorpresa" id="btnSorpresa" type="button">🎀 Abrí tu sorpresa</button>
</main>

<section class="seccion-ramo" id="seccionRamo"><div class="bouquet-upgrade-glow"></div>
  <p class="ramo-titulo">Un ramo para vos</p>
  <p class="ramo-subtitulo">Movelo con el dedo o el mouse</p>
  <canvas id="canvas-ramo"></canvas>
</section>

<script>
  // Generar pétalos/flores amarillas cayendo
  const emojis = ['🌼','🌻','✿'];
  const cantidad = 22;
  for(let i=0;i<cantidad;i++){
    const p = document.createElement('div');
    p.className = 'petalo';
    p.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    const size = 14 + Math.random()*20;
    p.style.fontSize = size + 'px';
    p.style.left = Math.random()*100 + 'vw';
    const duration = 8 + Math.random()*10;
    p.style.animationDuration = duration + 's';
    p.style.animationDelay = (Math.random()*10) + 's';
    p.style.setProperty('--drift', (Math.random()*80 - 40) + 'px');
    document.body.appendChild(p);
  }
</script>

<script>
  // ---- Overlay de video ----
  const overlay = document.getElementById('overlayVideo');
  const video = document.getElementById('videoSorpresa');
  const btnSorpresa = document.getElementById('btnSorpresa');
  const cerrarOverlay = document.getElementById('cerrarOverlay');
  const seccionRamo = document.getElementById('seccionRamo');
  let ramoIniciado = false;

  function abrirRegalo(){
    overlay.classList.remove('cerrando');
    overlay.classList.add('activo');
    video.currentTime = 0;
    video.play().catch(()=>{});
  }

  function cerrarRegalo(){
    overlay.classList.add('cerrando');
    setTimeout(()=>{
      overlay.classList.remove('activo','cerrando');
      video.pause();
      mostrarRamo();
    }, 480);
  }

  function mostrarRamo(){
    seccionRamo.classList.add('mostrar');
    seccionRamo.scrollIntoView({ behavior: 'smooth', block: 'start' });
    requestAnimationFrame(()=>{
      setTimeout(()=>{
        seccionRamo.classList.add('visible');
        if(!ramoIniciado){ ramoIniciado = true; iniciarRamo3D(); }
      }, 60);
    });
  }

  btnSorpresa.addEventListener('click', abrirRegalo);
  cerrarOverlay.addEventListener('click', cerrarRegalo);
  video.addEventListener('ended', cerrarRegalo);
  video.addEventListener('error', ()=>{
    // si el video no carga, igual mostramos el ramo
    overlay.classList.remove('activo');
    mostrarRamo();
  });

  // ---- Ramo de flores amarillas en 3D ----
  function iniciarRamo3D(){
    const canvas = document.getElementById('canvas-ramo');
    const rect = canvas.getBoundingClientRect();

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(
      35, rect.width / rect.height, 0.01, 1000
    );

    const renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      antialias: true,
      alpha: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(rect.width, rect.height, false);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.shadowMap.enabled = true;

    // Iluminación suave para conservar el aspecto cálido de la página.
    scene.add(new THREE.HemisphereLight(0xfff5d8, 0x6c5730, 2.2));

    const key = new THREE.DirectionalLight(0xffffff, 2.5);
    key.position.set(-4, 7, 6);
    key.castShadow = true;
    scene.add(key);

    const fill = new THREE.DirectionalLight(0xffd978, 1.25);
    fill.position.set(5, 3, 4);
    scene.add(fill);

    const rim = new THREE.DirectionalLight(0xfff0bd, 1.0);
    rim.position.set(0, 4, -6);
    scene.add(rim);

    const grupoRamo = new THREE.Group();
    scene.add(grupoRamo);

    // Controles reales: arrastrar para girar, rueda/pellizco para zoom.
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.075;
    controls.enablePan = false;
    controls.rotateSpeed = 0.7;
    controls.zoomSpeed = 0.8;
    controls.minDistance = 1.2;
    controls.maxDistance = 12;
    controls.minPolarAngle = 0.35;
    controls.maxPolarAngle = Math.PI - 0.35;
    controls.target.set(0, 0, 0);

    const loader = new THREE.GLTFLoader();

    loader.load(
      'ramo.glb',
      function(gltf){
        const modelo = gltf.scene;

        modelo.traverse(function(obj){
          if(obj.isMesh){
            obj.castShadow = true;
            obj.receiveShadow = true;
            if(obj.material){
              obj.material.needsUpdate = true;
            }
          }
        });

        // Centrar y escalar automáticamente cualquier tamaño/orientación del GLB.
        const box = new THREE.Box3().setFromObject(modelo);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);

        modelo.position.sub(center);

        const desiredHeight = 4.7;
        const scale = desiredHeight / maxDim;
        modelo.scale.setScalar(scale);

        grupoRamo.add(modelo);

        const fittedBox = new THREE.Box3().setFromObject(modelo);
        const fittedSize = fittedBox.getSize(new THREE.Vector3());
        const fittedCenter = fittedBox.getCenter(new THREE.Vector3());

        // Deja el ramo visualmente centrado en el recuadro.
        modelo.position.x -= fittedCenter.x;
        modelo.position.y -= fittedCenter.y;
        modelo.position.z -= fittedCenter.z;

        const finalMax = Math.max(fittedSize.x, fittedSize.y, fittedSize.z);
        camera.position.set(0, finalMax * 0.10, finalMax * 2.35);
        controls.target.set(0, 0, 0);
        controls.update();
      },
      undefined,
      function(error){
        console.error('No se pudo cargar ramo.glb:', error);
        const aviso = document.createElement('div');
        aviso.textContent = 'No se pudo cargar el modelo 3D.';
        aviso.style.cssText =
          'position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);' +
          'color:#8b641c;background:#fff7dcdd;padding:12px 16px;border-radius:14px;' +
          'font-family:Georgia,serif;pointer-events:none;';
        canvas.parentElement.style.position = 'relative';
        canvas.parentElement.appendChild(aviso);
      }
    );

    function ajustarTamaño(){
      const r = canvas.getBoundingClientRect();
      camera.aspect = r.width / r.height;
      camera.updateProjectionMatrix();
      renderer.setSize(r.width, r.height, false);
    }
    window.addEventListener('resize', ajustarTamaño);

    function animar(){
      requestAnimationFrame(animar);
      controls.update();
      renderer.render(scene, camera);
    }
    animar();
  }
</script>

</body>
</html>
