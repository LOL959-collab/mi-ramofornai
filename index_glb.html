<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visor 3D</title>
<style>
  * { box-sizing: border-box; }
  html, body { width:100%; height:100%; margin:0; }
  body {
    overflow:hidden;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color:#fff;
    background:
      radial-gradient(circle at 50% 35%, #28344b 0%, #111827 45%, #05070c 100%);
  }

  #app { position:fixed; inset:0; display:flex; flex-direction:column; }

  header {
    position:absolute;
    z-index:10;
    top:0; left:0; right:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:calc(14px + env(safe-area-inset-top)) 16px 14px;
    pointer-events:none;
    background:linear-gradient(to bottom, rgba(0,0,0,.48), transparent);
  }
  .brand {
    pointer-events:auto;
    display:flex;
    flex-direction:column;
    gap:2px;
    text-shadow:0 2px 12px #000;
  }
  .brand strong { font-size:18px; letter-spacing:.02em; }
  .brand span { font-size:12px; opacity:.7; }

  #viewer {
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
    outline:none;
  }

  .panel {
    position:absolute;
    z-index:10;
    left:50%;
    bottom:calc(18px + env(safe-area-inset-bottom));
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:18px;
    background:rgba(8,12,20,.62);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    box-shadow:0 12px 40px rgba(0,0,0,.35);
  }
  button {
    appearance:none;
    border:0;
    color:#fff;
    background:rgba(255,255,255,.09);
    min-width:44px;
    height:44px;
    padding:0 13px;
    border-radius:13px;
    cursor:pointer;
    font-size:16px;
    transition:.18s ease;
  }
  button:hover { background:rgba(255,255,255,.16); transform:translateY(-1px); }
  button:active { transform:scale(.96); }
  .hint {
    position:absolute;
    z-index:5;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    pointer-events:none;
    color:rgba(255,255,255,.7);
    font-size:13px;
    line-height:1.5;
    text-shadow:0 2px 10px #000;
    transition:opacity .5s ease;
  }
  .hint.hidden { opacity:0; }

  #loading {
    position:absolute;
    z-index:20;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:14px;
    background:rgba(5,7,12,.94);
    transition:opacity .4s ease, visibility .4s ease;
  }
  #loading.done { opacity:0; visibility:hidden; pointer-events:none; }
  .spinner {
    width:42px; height:42px;
    border:3px solid rgba(255,255,255,.16);
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  #loadingText { font-size:14px; opacity:.8; }

  #error {
    position:absolute;
    z-index:30;
    left:50%; top:50%;
    transform:translate(-50%,-50%);
    width:min(90%,420px);
    padding:20px;
    border-radius:18px;
    background:rgba(35,10,15,.94);
    border:1px solid rgba(255,120,140,.3);
    text-align:center;
    display:none;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  #error strong { display:block; margin-bottom:8px; }
  #error code { font-size:12px; opacity:.8; word-break:break-word; }

  @media (max-width:600px) {
    .brand strong { font-size:16px; }
    .panel { bottom:calc(12px + env(safe-area-inset-bottom)); }
    button { min-width:42px; height:42px; }
    .hint { width:85%; }
  }
</style>
</head>

<body>
<div id="app">
  <header>
    <div class="brand">
      <strong>Visor 3D</strong>
      <span>GLB / GLTF</span>
    </div>
  </header>

  <canvas id="viewer"></canvas>

  <div class="hint" id="hint">
    Arrastrá para girar<br>
    Pellizcá o usá la rueda para acercar
  </div>

  <div class="panel">
    <button id="reset" title="Restablecer vista" aria-label="Restablecer vista">↺</button>
    <button id="zoomOut" title="Alejar" aria-label="Alejar">−</button>
    <button id="zoomIn" title="Acercar" aria-label="Acercar">+</button>
    <button id="fullscreen" title="Pantalla completa" aria-label="Pantalla completa">⛶</button>
  </div>

  <div id="loading">
    <div class="spinner"></div>
    <div id="loadingText">Cargando modelo 3D…</div>
  </div>

  <div id="error">
    <strong>No se pudo cargar el modelo 3D</strong>
    <div>Comprobá que <code>ramo.glb</code> esté en la misma carpeta que este <code>index.html</code>.</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/loaders/GLTFLoader.js"></script>

<script>
(() => {
  // El GLB debe estar en la misma carpeta que index.html en GitHub Pages.
  const MODEL_URL = "ramo.glb";

  const canvas = document.getElementById("viewer");
  const loading = document.getElementById("loading");
  const loadingText = document.getElementById("loadingText");
  const errorBox = document.getElementById("error");
  const hint = document.getElementById("hint");

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x080b12);

  const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 1000);
  const renderer = new THREE.WebGLRenderer({
    canvas,
    antialias:true,
    alpha:false,
    powerPreference:"high-performance"
  });

  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  // Iluminación equilibrada para que el GLB se vea bien sin importar demasiado
  // cómo fue exportado.
  scene.add(new THREE.HemisphereLight(0xffffff, 0x20283a, 2.2));

  const key = new THREE.DirectionalLight(0xffffff, 3.0);
  key.position.set(5, 8, 6);
  key.castShadow = true;
  scene.add(key);

  const fill = new THREE.DirectionalLight(0x9fb8ff, 1.5);
  fill.position.set(-6, 3, 4);
  scene.add(fill);

  const rim = new THREE.DirectionalLight(0xffd7a0, 1.2);
  rim.position.set(0, 5, -7);
  scene.add(rim);

  const modelGroup = new THREE.Group();
  scene.add(modelGroup);

  const controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.075;
  controls.enablePan = false;
  controls.rotateSpeed = 0.75;
  controls.zoomSpeed = 0.9;
  controls.minDistance = 0.5;
  controls.maxDistance = 50;
  controls.minPolarAngle = 0.05;
  controls.maxPolarAngle = Math.PI - 0.05;

  let initialCameraPosition = new THREE.Vector3(0, 0.5, 5);
  let initialTarget = new THREE.Vector3(0, 0, 0);

  function resize() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
  }

  window.addEventListener("resize", resize);
  resize();

  function frameModel(model) {
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());

    // Centrar el modelo en el origen.
    model.position.sub(center);

    const maxDim = Math.max(size.x, size.y, size.z) || 1;
    const desiredSize = 4.2;
    const scale = desiredSize / maxDim;
    model.scale.setScalar(scale);

    // Volver a calcular después de escalar y centrar.
    const fitted = new THREE.Box3().setFromObject(model);
    const fittedSize = fitted.getSize(new THREE.Vector3());
    const fittedCenter = fitted.getCenter(new THREE.Vector3());
    model.position.sub(fittedCenter);

    const finalDim = Math.max(fittedSize.x, fittedSize.y, fittedSize.z) || 1;
    const distance = finalDim * 1.8;

    initialTarget.set(0, 0, 0);
    initialCameraPosition.set(0, finalDim * 0.15, distance);

    camera.position.copy(initialCameraPosition);
    controls.target.copy(initialTarget);
    controls.minDistance = Math.max(finalDim * 0.45, 0.15);
    controls.maxDistance = Math.max(finalDim * 8, 10);
    controls.update();
  }

  function resetView() {
    camera.position.copy(initialCameraPosition);
    controls.target.copy(initialTarget);
    controls.update();
  }

  function showError() {
    loading.classList.add("done");
    errorBox.style.display = "block";
  }

  const loader = new THREE.GLTFLoader();

  loader.load(
    MODEL_URL,
    (gltf) => {
      const model = gltf.scene;

      model.traverse((obj) => {
        if (obj.isMesh) {
          obj.castShadow = true;
          obj.receiveShadow = true;

          if (obj.material) {
            obj.material.needsUpdate = true;
          }
        }
      });

      modelGroup.add(model);
      frameModel(model);

      loading.classList.add("done");
      setTimeout(() => hint.classList.add("hidden"), 3500);
    },
    (xhr) => {
      if (xhr.total > 0) {
        const percent = Math.round((xhr.loaded / xhr.total) * 100);
        loadingText.textContent = `Cargando modelo 3D… ${percent}%`;
      } else {
        loadingText.textContent = "Cargando modelo 3D…";
      }
    },
    (err) => {
      console.error("Error cargando", MODEL_URL, err);
      showError();
    }
  );

  document.getElementById("reset").addEventListener("click", resetView);

  document.getElementById("zoomIn").addEventListener("click", () => {
    controls.dollyIn(1.25);
    controls.update();
  });

  document.getElementById("zoomOut").addEventListener("click", () => {
    controls.dollyOut(1.25);
    controls.update();
  });

  document.getElementById("fullscreen").addEventListener("click", async () => {
    try {
      if (!document.fullscreenElement) {
        await document.documentElement.requestFullscreen();
      } else {
        await document.exitFullscreen();
      }
    } catch (e) {
      console.warn("Pantalla completa no disponible:", e);
    }
  });

  // También permite doble toque/clic para restablecer la vista.
  let lastTap = 0;
  canvas.addEventListener("pointerup", () => {
    const now = Date.now();
    if (now - lastTap < 300) resetView();
    lastTap = now;
  });

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();
})();
</script>
</body>
</html>
